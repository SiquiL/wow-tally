  <title id="title">Tally</title>
  <desc id="description">
    World of Warcraft addon. Every step. Every death. Every coin. Accounted for.
    Counts distance, deaths, gold, quests, jumps, teleports, professions and playtime.
  </desc>
  <defs>
    <radialGradient id="glow" cx=".5" cy=".45" r=".7">
      <stop offset="0" stop-color="#3b2a0f"/>
      <stop offset=".6" stop-color="#17120b"/>
      <stop offset="1" stop-color="#0e0c09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="94" x2="0" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2c4"/>
      <stop offset=".55" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#a87418"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eedba8" stroke-opacity=".05"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="20.5" y="20.5" width="1239" height="599" rx="10" fill="none" stroke="#d9b96e" stroke-opacity=".3"/>

